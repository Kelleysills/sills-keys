# Points the home-screen icon at today's theme (from themes.txt in the releases repo) or the normal icon. Runs daily.
name: Theme icon
on:
  schedule:
    - cron: "10 8 * * *"    # ~00:10 Pacific
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/pick_icon.py
      - run: |
          git config user.name "sills-theme-bot"; git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then git commit -am "Theme icon for $(TZ=America/Los_Angeles date +%F)" && git push; fi
